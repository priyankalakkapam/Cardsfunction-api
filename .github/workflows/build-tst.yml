name: fortexx_cardsfunction_api - TST Build

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Windows, TST]
    environment: TST

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Removed setup-dotnet to prevent "C:\Program Files" write access errors.
      # The runner will use the .NET SDK already installed on DESKTOP-BE1AC6Q.

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: dotnet restore
        run: dotnet restore
        working-directory: Status_HyperpayFunction

      - name: dotnet build
        run: dotnet build --configuration Release --no-restore
        working-directory: Status_HyperpayFunction

      - name: dotnet publish
        run: dotnet publish --configuration Release --output ./publish
        working-directory: Status_HyperpayFunction

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardsfunction_api_tst
          path: Status_HyperpayFunction/publish
          retention-days: 30
