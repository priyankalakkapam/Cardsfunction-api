name: fortexx_cardsfunction_api - TST Build

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    # Running on your specific self-hosted machine
    runs-on: [self-hosted, Windows, TST]
    environment: TST

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          # This uses the single JSON secret you created in image_665cd7.png
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # No 'setup-dotnet' step here to avoid the C:\Program Files permission error.
      # It will use the .NET 10.0.103 already on your machine.

      - name: dotnet restore
        run: dotnet restore
        working-directory: Status_HyperpayFunction

      - name: dotnet build
        run: dotnet build --configuration Release --no-restore
        working-directory: Status_HyperpayFunction

      - name: dotnet publish
        run: dotnet publish --configuration Release --output ./publish
        working-directory: Status_HyperpayFunction

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardsfunction_api_tst
          path: Status_HyperpayFunction/publish
          retention-days: 30
