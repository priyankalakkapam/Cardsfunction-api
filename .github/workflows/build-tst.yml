name: fortexx_cardsfunction_api - TST Build

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    # Using the specific tags for your self-hosted Windows environment
    runs-on: [self-hosted, Windows, TST]
    environment: TST

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2 # Updated to v2 as seen in your logs
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: dotnet restore
        run: dotnet restore
        working-directory: Status_HyperpayFunction

      - name: dotnet build
        run: dotnet build --configuration Release --no-restore
        working-directory: Status_HyperpayFunction

      - name: dotnet publish
        run: dotnet publish --configuration Release --output ./publish
        working-directory: Status_HyperpayFunction

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardsfunction_api_tst
          path: Status_HyperpayFunction/publish
          retention-days: 30
